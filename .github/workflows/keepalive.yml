name: 💓 Keep App Awake

# Keeps EITHER deployment awake by pinging /healthz every 10 minutes.
#   - Render (recommended, no card): set repo secret RENDER_APP_URL to your
#     service URL, e.g. https://hermes-stack.onrender.com
#     (Render sleeps free services after ~15 min idle; traffic wakes them.)
#   - Hugging Face Space (needs PRO for Docker now): set HF_USERNAME +
#     HF_SPACE_NAME (+ HF_TOKEN for wake-via-API). Legacy path, kept working.
#
# If nothing is configured, this job exits quietly so scheduled runs never
# fail-noise your Actions tab. Zero dependencies (curl only).

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min = 144 polite pings/day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive-app
  cancel-in-progress: false

jobs:
  ping:
    name: Ping /healthz
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the app (and wake it if sleeping)
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -u
          if [ -n "${RENDER_APP_URL:-}" ]; then
            APP_URL="${RENDER_APP_URL%/}/healthz"
            echo "Render mode -> ${APP_URL}"
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                    --max-time 30 -A "hermes-stack-keepalive/1.0" "$APP_URL" || echo "000")
            echo "healthz -> HTTP ${CODE}"
            if [ "${CODE}" = "200" ]; then
              echo "✅ App is up."
            else
              echo "⚠️ App did not answer (Render wakes on traffic — next ping retries)."
            fi
            exit 0
          fi
          if [ -z "${HF_USERNAME:-}" ] || [ -z "${HF_SPACE_NAME:-}" ]; then
            echo "Nothing to keep alive — set RENDER_APP_URL (Render) or HF_USERNAME/HF_SPACE_NAME (HF)."
            echo "Render guide (no card needed): docs/render-deploy.md"
            exit 0
          fi
          REPO_ID="${HF_USERNAME}/${HF_SPACE_NAME}"
          APP_URL="https://${HF_USERNAME}-${HF_SPACE_NAME}.hf.space/healthz"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --max-time 30 -A "hermes-stack-keepalive/1.0" "$APP_URL" || echo "000")
          echo "healthz -> HTTP ${CODE}"
          if [ "${CODE}" = "200" ]; then
            echo "✅ Space is up."
            exit 0
          fi
          echo "Space did not answer — checking runtime stage via HF API…"
          STAGE=$(curl -s --max-time 30 \
                    -H "Authorization: Bearer ${HF_TOKEN}" \
                    "https://huggingface.co/api/spaces/${REPO_ID}/runtime" \
                  | python3 -c "import sys,json;print(json.load(sys.stdin).get('runtime',{}).get('stage','UNKNOWN'))" 2>/dev/null || echo "UNKNOWN")
          echo "runtime stage: ${STAGE}"
          if [ "${STAGE}" = "SLEEPING" ] || [ "${CODE}" = "000" ]; then
            echo "💤 Sleeping/unreachable — requesting a restart…"
            HTTP=$(curl -s -o /tmp/restart.json -w "%{http_code}" --max-time 30 \
                    -X POST \
                    -H "Authorization: Bearer ${HF_TOKEN}" \
                    "https://huggingface.co/api/spaces/${REPO_ID}/restart" || echo "000")
            echo "restart -> HTTP ${HTTP}"
            [ "${HTTP}" = "200" ] || cat /tmp/restart.json 2>/dev/null || true
          else
            echo "Space is building/running-but-warming — no action taken."
          fi
